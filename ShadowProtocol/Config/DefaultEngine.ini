; SHADOW PROTOCOL: NASSER 07 — engine configuration

[/Script/EngineSettings.GameMapsSettings]
GameDefaultMap=/Game/Maps/L_GrayboxRange.L_GrayboxRange
EditorStartupMap=/Game/Maps/L_GrayboxRange.L_GrayboxRange
GlobalDefaultGameMode=/Script/ShadowProtocol.SPGrayboxGameMode
GameInstanceClass=/Script/Engine.GameInstance

[/Script/Engine.RendererSettings]
; --- UE5 feature set required by the brief -------------------------------
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=True
r.DefaultFeature.AntiAliasing=2
r.AntiAliasingMethod=4
r.Nanite=True
r.Nanite.ProjectEnabled=True
r.Lumen.HardwareRayTracing=True
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.SkinCache.CompileShaders=True
r.SupportSkyAtmosphere=True
r.SupportLocalFogVolumes=True
r.VolumetricFog=True
r.VolumetricCloud=True
r.DefaultFeature.AmbientOcclusion=True
r.AllowStaticLighting=False
r.VelocityOutputPass=1
r.Streaming.PoolSize=3000
r.Streaming.LimitPoolSizeToVRAM=1

; --- 1973 vs modern look dev --------------------------------------------
; Global defaults only; per-chapter post-process volumes carry the identity
; (see docs/03_TECHNICAL_ARCHITECTURE.md, "Two visual identities").
r.TonemapperFilm=1
r.Color.Max=1.0
r.Tonemapper.Sharpen=0.35

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
Compiler=Default
AudioSampleRate=48000
AudioCallbackBufferFrameSize=1024
AudioNumBuffersToEnqueue=2

[/Script/Engine.PhysicsSettings]
DefaultGravityZ=-980.000000
PhysicsPrediction=False
bSubstepping=True
MaxSubstepDeltaTime=0.016667
MaxSubsteps=4

[/Script/Engine.CollisionProfile]
; Preset used by the interaction/objective/extraction volumes.
+Profiles=(Name="SP_Trigger",CollisionEnabled=QueryOnly,ObjectTypeName="WorldDynamic",CustomResponses=((Channel="Pawn",Response=ECR_Overlap),(Channel="Visibility",Response=ECR_Ignore)),HelpMessage="Shadow Protocol gameplay trigger volume")
+Profiles=(Name="SP_IntelPickup",CollisionEnabled=QueryOnly,ObjectTypeName="WorldDynamic",CustomResponses=((Channel="Pawn",Response=ECR_Overlap)),HelpMessage="Shadow Protocol intelligence pickup")
+DefaultChannelResponses=(Channel=ECC_GameTraceChannel1,DefaultResponse=ECR_Block,bTraceType=False,bStaticObject=False,Name="SP_Ballistic")

[/Script/Engine.Engine]
bSmoothFrameRate=True
MinSmoothedFrameRate=30
MaxSmoothedFrameRate=120
bUseFixedFrameRate=False

[/Script/NavigationSystem.NavigationSystemV1]
bAutoCreateNavigationData=True
bAllowClientSideNavigation=False

[/Script/AIModule.AISystem]
bEnableDebuggerPlugin=False

[/Script/Engine.AudioSettings]
DefaultSoundClassName=/Engine/EngineSounds/Master.Master
DefaultReverbSendLevel=0.15

